[env:STM32WLE5-LP]
extends = stm32_base
board = lora_e5_dev_board
board_level = pr
board_upload.maximum_size = 233472 ; reserve the last 28KB for filesystem
build_flags =
  ${stm32_base.build_flags}
  -Ivariants/stm32/STM32WLE5-LP
  -DSERIAL_UART_INSTANCE=2
  -UDEBUG_MUTE 
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_GPS=1

upload_port = stlink

lib_deps =
  ${stm32_base.lib_deps}
  # Add your custom sensor here!

[env:STM32WLE5-LP-min]
extends = env:STM32WLE5-LP
board_level = pr
board_upload.maximum_size = 233472 ; reserve the last 28KB for filesystem

; minimal profile for 256KB flash target:
; keep LoRa mesh + text + Admin + Serial API + PKI
build_flags =
  ${env:STM32WLE5-LP.build_flags}
  ; NOTE: do not use MESHTASTIC_MINIMIZE_BUILD here, it hard-disables PKI/Admin/Serial via configuration.h
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_TRACEROUTE=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_NODEINFO=1
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  -g0
  -Wl,--gc-sections

; keep stm32 filter and additionally cut known unused components for this profile
build_src_filter =
  ${stm32_base.build_src_filter}

upload_port = stlink

lib_deps =
  ${env:STM32WLE5-LP.lib_deps}
